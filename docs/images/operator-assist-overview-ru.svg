  <text x="124" y="536" fill="#17324D" font-family="Segoe UI, Arial, sans-serif" font-size="19">Tkinter-интерфейс для работы оператора.</text>
  <text x="124" y="570" fill="#5F7184" font-family="Segoe UI, Arial, sans-serif" font-size="19">Два канала, диагностика, журналы и экспорт.</text>

