  <text x="772" y="302" fill="#17324D" font-family="Segoe UI, Arial, sans-serif" font-size="19">• Словарь терминов</text>
  <text x="772" y="336" fill="#17324D" font-family="Segoe UI, Arial, sans-serif" font-size="19">• ИТ-режим</text>
  <text x="772" y="370" fill="#17324D" font-family="Segoe UI, Arial, sans-serif" font-size="19">• Удаление дублей</text>

