name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}\operator_assist_pyc
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies (no speech models)
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q operator_assist.py operator_assist_chat_bridge_v3_base.py operator_assist_chat_bridge_v5_base.py operator_assist_chat_window_test.py operator_assist_runtime asr_lab tests

      - name: Run runtime and offline ASR lab unit tests
        run: python -m unittest discover -s tests -v
