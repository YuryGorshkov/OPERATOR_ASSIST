name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve project version
        id: version
        shell: pwsh
        run: |
          $pyproject = Get-Content -Path 'pyproject.toml' -Raw
          if ($pyproject -notmatch '(?m)^\s*version\s*=\s*"([^"]+)"\s*$') {
            throw "Unable to resolve version from pyproject.toml"
          }

          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Validate tag matches project version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $expectedTag = '${{ steps.version.outputs.tag }}'
          $actualTag = '${{ github.ref_name }}'
          if ($actualTag -ne $expectedTag) {
            throw "Tag $actualTag does not match project version $expectedTag"
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build release assets
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File .\scripts\Build-Release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPERATOR_ASSIST-release-${{ steps.version.outputs.version }}
          path: |
            release/publish/OPERATOR_ASSIST-portable-${{ steps.version.outputs.version }}.zip
            release/publish/OPERATOR_ASSIST-Setup-${{ steps.version.outputs.version }}.exe
            release/publish/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(
            "release/publish/OPERATOR_ASSIST-portable-$env:RELEASE_VERSION.zip#Portable bundle (ZIP)",
            "release/publish/OPERATOR_ASSIST-Setup-$env:RELEASE_VERSION.exe#Windows installer",
            "release/publish/SHA256SUMS.txt#SHA256 checksums"
          )

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets --title $env:RELEASE_TAG --verify-tag --generate-notes
          }
